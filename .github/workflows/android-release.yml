name: Build and publish Krono Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Prepare APK for download
        run: cp android/app/build/outputs/apk/release/app-release.apk Krono-Android.apk

      - name: Save APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Krono-Android-APK
          path: Krono-Android.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check whether this is still the latest main commit
        id: latest-main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release: a newer commit is already on main."
          fi

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.latest-main.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Krono for Android (Build ${{ github.run_number }})
          body: |
            Install Krono on an Android phone by downloading **Krono-Android.apk** below.

            - Tasks are saved locally on your device.
            - No account or cloud setup is required.
            - Allow notifications to receive deadline reminders.

            This APK is generated automatically from the repository's main branch.
          files: Krono-Android.apk
          draft: false
          prerelease: false
          make_latest: true
